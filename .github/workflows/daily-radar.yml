name: 每日雷达云端抓取

on:
  schedule:
    # GitHub 免费版 cron 经常延迟甚至直接跳过，故设三个时间点互为备份：
    # 北京时间 12:00 / 14:00 / 16:00。脚本内有幂等保护，当天已有足量数据会自动跳过。
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行抓取脚本
        run: python radar_fetch.py
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: ${{ secrets.ZHIPU_MODEL }}
          # 手动触发时强制抓取；定时触发则走幂等检查（当天已有足量数据就跳过）
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
