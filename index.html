        <select id="fMatType" onchange="renderMaterials()"><option value="">全部类型</option><option>政策文件</option><option>监管数据</option><option>裁判文书</option><option>媒体报道</option><option>专家观点</option><option>采访笔记</option><option>其他</option></select>

        <select id="fSrcStatus" onchange="renderSources()"><option value="">全部进度</option><option>待联系</option><option>已联系</option><option>已采访</option></select>

<footer>深度采写工作台 · build <span id="buildVer"></span> · 数据云端同步 · 本地自动缓存</footer>
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const BUILD='2026.10.15-b06';
const API='https://yulin-scale-sync.onrender.com';
const ROOM='caixie2026';
const LSKEY='shendu-workbench-cache';
const LS_SAVEDAT='shendu-workbench-savedat';

// ---------- 数据 ----------
let DB={topics:[],materials:[],sources:[],drafts:[],reviews:[]};
let cloudSavedAt=0;          // 我们已知的云端版本时间
let dirty=false, saveTimer=null, online=false;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=t=>{if(!t)return'';const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDT=t=>{if(!t)return'';const d=new Date(t);return fmtD(t)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const cnLen=s=>(String(s||'').replace(/\s/g,'')).length;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2200);}
function setSync(state,txt){const d=document.getElementById('syncDot');d.className='dot'+(state?' '+state:'');document.getElementById('syncText').textContent=txt;}

// ---------- 同步 ----------
async function loadCloud(){
  setSync('saving','连接中…');
  try{
    const r=await fetch(API+'/api/load/'+ROOM,{signal:AbortSignal.timeout(60000)});
    if(r.status===404){online=true;setSync('','已连接 · 首次使用');restoreLocal();renderAll();return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const savedAt=parseInt(r.headers.get('X-Saved-At')||'0',10)||0;
    const data=await r.json();
    const localAt=parseInt(localStorage.getItem(LS_SAVEDAT)||'0',10)||0;
    if(savedAt>=localAt||!localStorage.getItem(LSKEY)){
      DB=normalize(data);cloudSavedAt=savedAt;cacheLocal(savedAt);
    }else{
      restoreLocal(); // 本地更新（离线改过），保持本地，稍后备份上传
      dirty=true;scheduleSave();
    }
    online=true;setSync('','已同步 '+fmtDT(cloudSavedAt||Date.now()));renderAll();
  }catch(e){
    online=false;setSync('off','离线 · 用本地缓存');restoreLocal();renderAll();
  }
}
function restoreLocal(){
  try{const s=localStorage.getItem(LSKEY);if(s){DB=normalize(JSON.parse(s));}}catch(e){}
}
function cacheLocal(savedAt){
  try{localStorage.setItem(LSKEY,JSON.stringify(DB));if(savedAt)localStorage.setItem(LS_SAVEDAT,String(savedAt));}catch(e){}
}
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  return{topics:d.topics||[],materials:d.materials||[],sources:d.sources||[],drafts:d.drafts||[],reviews:d.reviews||[]};
}
function markDirty(){dirty=true;cloudSavedAt=cloudSavedAt||0;cacheLocal();scheduleSave();renderAll();}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,1500);}
async function saveCloud(force){
  if(!dirty&&!force)return;
  setSync('saving','同步中…');
  try{
    const u=API+'/api/save?id='+ROOM+'&base='+cloudSavedAt+(force?'&force=1':'');
    const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB),signal:AbortSignal.timeout(60000)});
    if(r.status===409){
      setSync('err','冲突：云端有更新');
      if(confirm('另一台设备（或 AI）刚更新过云端数据。\n\n点「确定」= 拉取云端最新（放弃本机未上传改动）\n点「取消」= 保留本机内容并强制覆盖云端')){
        dirty=false;loadCloud();
      }else{saveCloud(true);}
      return;
    }
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    cloudSavedAt=j.savedAt||Date.now();dirty=false;online=true;
    cacheLocal(cloudSavedAt);
    setSync('','已同步 '+fmtDT(cloudSavedAt));
  }catch(e){online=false;setSync('err','同步失败 · 已存本机，联网后自动补传');scheduleSave();}
}
function manualSync(){if(dirty){saveCloud();}else{loadCloud();}}
setInterval(()=>{if(dirty&&online!==false)saveCloud();},30000);
window.addEventListener('beforeunload',()=>{if(dirty&&navigator.sendBeacon){navigator.sendBeacon(API+'/api/save?id='+ROOM+'&force=1',new Blob([JSON.stringify(DB)],{type:'application/json'}));}});

// ---------- 导航 ----------
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+b.dataset.tab));
  renderAll();
});

// ---------- 弹窗 ----------
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('mask').classList.add('on');}
function closeModal(){document.getElementById('mask').classList.remove('on');}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function selVal(id){return val(id);}

// ---------- 选题 ----------
const TOPIC_FLOW=['候选','孵化中','采写中','已成稿','已发布'];
function topicById(id){return DB.topics.find(t=>t.id===id);}
function openTopicForm(t){
  t=t||{};
  openModal(`<h3>${t.id?'编辑选题':'新建选题'}</h3>
  <div class="f-row"><label>选题标题 *</label><input type="text" id="tf_title" value="${esc(t.title||'')}" placeholder="例：预制菜添加剂标注乱象调查"></div>
  <div class="f-2"><div class="f-row"><label>领域</label><select id="tf_field"><option ${t.field==='食品安全'?'selected':''}>食品安全</option><option ${t.field==='消费维权'?'selected':''}>消费维权</option><option ${t.field==='民生其他'?'selected':''}>民生其他</option></select></div>
  <div class="f-row"><label>价值评分（1-5）</label><input type="number" id="tf_score" min="1" max="5" value="${t.score||4}"></div></div>

  <div class="f-row"><label>竞品动态</label><input type="text" id="tf_competitor" value="${esc(t.competitor||'')}" placeholder="绿松鼠/民生调查局是否已做"></div></div>
  <div class="f-row"><label>备注</label><textarea id="tf_notes">${esc(t.notes||'')}</textarea></div>
  <div class="m-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveTopic('${t.id||''}')">保存</button></div>`);
}
function saveTopic(id){
  const title=val('tf_title');if(!title){toast('标题必填');return;}
  let t=id?topicById(id):null;
  if(!t){t={id:uid(),status:'候选',createdAt:Date.now()};DB.topics.unshift(t);}
  Object.assign(t,{title,field:selVal('tf_field'),score:parseInt(val('tf_score'))||4,reason:val('tf_reason'),angle:val('tf_angle'),source:val('tf_source'),competitor:val('tf_competitor'),notes:val('tf_notes'),updatedAt:Date.now()});
  closeModal();markDirty();toast('已保存');
}
function setTopicStatus(id,st){const t=topicById(id);if(!t)return;t.status=st;t.updatedAt=Date.now();markDirty();}
function delTopic(id){
  const t=topicById(id);if(!t)return;
  const mc=DB.materials.filter(m=>m.topicId===id).length;
  if(!confirm(`删除选题「${t.title}」？${mc?'\n注意：它下面还有 '+mc+' 条素材（素材会保留但失去关联）。':''}`))return;
  DB.topics=DB.topics.filter(x=>x.id!==id);markDirty();toast('已删除');
}
function topicCard(t,compact){
  const stars='★'.repeat(t.score||0)+'☆'.repeat(5-(t.score||0));
  const matN=DB.materials.filter(m=>m.topicId===t.id).length;
  return `<div class="card">
    <h3>${esc(t.title)}</h3>
    <div class="meta"><span class="tag t-field">${esc(t.field||'')}</span><span class="badge st-${esc(t.status)}">${esc(t.status)}</span><span class="score">${stars}</span><span class="tag t-date">${fmtD(t.updatedAt||t.createdAt)}</span></div>
    ${t.reason?`<div class="desc"><b>为什么做：</b>${esc(t.reason)}</div>`:''}
    ${t.angle?`<div class="desc"><b>角度：</b>${esc(t.angle)}</div>`:''}
    <div class="meta">${t.source?`<span>线索：${esc(t.source)}</span>`:''}${t.competitor?`<span>竞品：${esc(t.competitor)}</span>`:''}<span>素材 ${matN} 条</span></div>
    ${compact?'':`<div class="actions">
      ${TOPIC_FLOW.map(s=>t.status!==s&&t.status!=='搁置'?`<button class="link-btn" onclick="setTopicStatus('${t.id}','${s}')">${s}</button>`:'').join('')}
      ${t.status!=='搁置'?`<button class="link-btn" onclick="setTopicStatus('${t.id}','搁置')">搁置</button>`:`<button class="link-btn" onclick="setTopicStatus('${t.id}','候选')">恢复</button>`}
      <span style="flex:1"></span>
      <button class="link-btn" onclick='openTopicForm(${JSON.stringify(t).replace(/'/g,"&#39;")})'>编辑</button>
      <button class="link-btn danger" onclick="delTopic('${t.id}')">删除</button>
    </div>`}
  </div>`;
}
function renderTopics(){
  const fs=val('fTopicStatus'),ff=val('fTopicField');
  const list=DB.topics.filter(t=>(!fs||t.status===fs)&&(!ff||t.field===ff));
  document.getElementById('topicList').innerHTML=list.length?list.map(t=>topicCard(t)).join(''):
    `<div class="empty" style="grid-column:1/-1"><b>还没有选题</b>点右上角「新建选题」，或在 WorkBuddy 里让 AI「把今天的深度选题同步到工作台」</div>`;
}

function openMatForm(m){

  <div class="f-2"><div class="f-row"><label>来源（机构/媒体+文件名）</label><input type="text" id="mf_source" value="${esc(m.source||'')}" placeholder="例：市场监管总局官网"></div>

function delMat(id){if(!confirm('删除这条素材？'))return;DB.materials=DB.materials.filter(x=>x.id!==id);markDirty();}
function renderMaterials(){
  const ft=val('fMatTopic'),fy=val('fMatType');

  const cur=sel.value;
  sel.innerHTML='<option value="">全部选题</option>'+DB.topics.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('');
  sel.value=cur;
  const list=DB.materials.filter(m=>(!ft||m.topicId===ft)&&(!fy||m.type===fy));
  document.getElementById('matList').innerHTML=list.length?list.map(m=>{
    const tp=topicById(m.topicId);
    return `<div class="card">
      <h3>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)} 🔗</a>`:esc(m.title)}</h3>
      <div class="meta"><span class="tag t-type">${esc(m.type||'')}</span>${tp?`<span class="tag t-field">${esc(tp.title.slice(0,14))}${tp.title.length>14?'…':''}</span>`:''}${m.date?`<span class="tag t-date">${esc(m.date)}</span>`:''}</div>
      <div class="desc">${esc(m.summary)}</div>
      <div class="meta">${m.source?`<span>来源：${esc(m.source)}</span>`:''}</div>
      <div class="actions"><span style="flex:1"></span>
        <button class="link-btn" onclick='openMatForm(${JSON.stringify(m).replace(/'/g,"&#39;")})'>编辑</button>
        <button class="link-btn danger" onclick="delMat('${m.id}')">删除</button></div>
    </div>`;}).join(''):
    `<div class="empty" style="grid-column:1/-1"><b>素材夹是空的</b>每条素材都带来源和日期，写作时随取随用、事实可溯源</div>`;
}

function delSrc(id){if(!confirm('删除这个采访对象？'))return;DB.sources=DB.sources.filter(x=>x.id!==id);markDirty();}
function setSrcStatus(id,st){const s=DB.sources.find(x=>x.id===id);if(!s)return;s.status=st;markDirty();}

// ---------- 稿件库 ----------
function openDraftForm(d){
  d=d||{};
  const tOpts=DB.topics.map(t=>`<option value="${t.id}" ${d.topicId===t.id?'selected':''}>${esc(t.title)}</option>`).join('');
  openModal(`<h3>${d.id?'编辑稿件':'新建稿件'}</h3>
  <div class="f-row"><label>稿件标题 *</label><input type="text" id="df_title" value="${esc(d.title||'')}"></div>
  <div class="f-2"><div class="f-row"><label>关联选题</label><select id="df_topic"><option value="">（不关联）</option>${tOpts}</select></div>
  <div class="f-row"><label>状态</label><select id="df_status">${['大纲','初稿','改稿中','待终审','已发布'].map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <div class="m-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveDraft('${d.id||''}')">保存</button></div>`);
}
function saveDraft(id){
  const title=val('df_title');if(!title){toast('标题必填');return;}
  let d=id?DB.drafts.find(x=>x.id===id):null;
  if(!d){d={id:uid(),versions:[],createdAt:Date.now()};DB.drafts.unshift(d);}
  Object.assign(d,{title,topicId:val('df_topic'),status:selVal('df_status'),updatedAt:Date.now()});
  closeModal();markDirty();toast('已保存');
}
function delDraft(id){
  if(!confirm('删除这篇稿件及其所有版本？'))return;
  DB.drafts=DB.drafts.filter(x=>x.id!==id);DB.reviews=DB.reviews.filter(r=>r.draftId!==id);markDirty();
}
function openVersionForm(did){
  openModal(`<h3>存入新版本</h3>
  <div class="f-row"><label>版本说明</label><input type="text" id="vf_note" placeholder="例：初稿 / 按质检意见修改后"></div>
  <div class="f-row"><label>正文（粘贴全文）</label><textarea id="vf_content" style="min-height:220px" placeholder="把稿子全文粘贴到这里…"></textarea></div>
  <div class="m-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveVersion('${did}')">存为版本</button></div>`);
}
function saveVersion(did){
  const d=DB.drafts.find(x=>x.id===did);if(!d)return;
  const content=document.getElementById('vf_content').value;
  if(!content.trim()){toast('内容为空');return;}
  d.versions.push({ver:d.versions.length+1,note:val('vf_note')||('版本 '+(d.versions.length+1)),content,createdAt:Date.now()});
  d.updatedAt=Date.now();closeModal();markDirty();toast('已存版本 '+d.versions.length);
}
function viewVersion(did,ver){
  const d=DB.drafts.find(x=>x.id===did);const v=d&&d.versions.find(x=>x.ver===ver);if(!v)return;
  openModal(`<h3>${esc(d.title)} · v${v.ver} ${esc(v.note||'')}</h3>
  <div class="meta" style="margin-bottom:8px">${fmtDT(v.createdAt)} · 约 ${cnLen(v.content)} 字</div>
  <div style="max-height:60vh;overflow-y:auto;white-space:pre-wrap;font-size:14px;line-height:1.9;border:1px solid var(--line);border-radius:8px;padding:14px">${esc(v.content)}</div>
  <div class="m-actions"><button class="btn ghost" onclick="copyText('','${did}',${v.ver});return false">复制全文</button><button class="btn" onclick="closeModal()">关闭</button></div>`);
}
function copyText(_,did,ver){
  const d=DB.drafts.find(x=>x.id===did);const v=d&&d.versions.find(x=>x.ver===ver);
  if(v){navigator.clipboard.writeText(v.content).then(()=>toast('已复制')).catch(()=>toast('复制失败'));}
}
function draftReviews(did){return DB.reviews.filter(r=>r.draftId===did);}
function renderDrafts(){
  const fs=val('fDraftStatus');
  const list=DB.drafts.filter(d=>!fs||d.status===fs);
  const box=document.getElementById('draftList');
  if(!list.length){box.innerHTML=`<div class="empty"><b>稿件库是空的</b>AI 主笔的初稿、你的修改版本、质检意见都会归档在这里</div>`;return;}
  box.innerHTML=list.map(d=>{
    const tp=topicById(d.topicId);
    const lastV=d.versions[d.versions.length-1];
    const revs=draftReviews(d.id);
    const lastRev=revs[0];
    return `<div class="detail">
      <h3>${esc(d.title)}</h3>
      <div class="meta"><span class="badge st-${esc(d.status==='已发布'?'已发布':d.status==='待终审'?'已成稿':'采写中')}">${esc(d.status)}</span>
      ${tp?`<span class="tag t-field">${esc(tp.title.slice(0,16))}${tp.title.length>16?'…':''}</span>`:''}
      <span class="tag t-date">更新 ${fmtD(d.updatedAt||d.createdAt)}</span>
      ${lastV?`<span class="tag t-date">v${lastV.ver} · 约 ${cnLen(lastV.content)} 字</span>`:'<span class="tag t-date">暂无正文版本</span>'}</div>
      <div class="actions" style="border:0;padding-top:2px">
        <button class="btn sm" onclick="openVersionForm('${d.id}')">＋ 存入新版本</button>
        ${d.versions.map(v=>`<button class="link-btn" onclick="viewVersion('${d.id}',${v.ver})">v${v.ver} ${esc((v.note||'').slice(0,10))}</button>`).join('')}
        <span style="flex:1"></span>
        <button class="link-btn" onclick='openDraftForm(${JSON.stringify(d).replace(/'/g,"&#39;")})'>编辑</button>
        <button class="link-btn danger" onclick="delDraft('${d.id}')">删除</button>
      </div>
      ${lastRev?`<div style="margin-top:10px"><div class="meta" style="margin-bottom:6px">最新质检（${fmtDT(lastRev.createdAt)}）：${esc(lastRev.summary||'')}</div>
        ${lastRev.items.slice(0,20).map(it=>`<div class="review-item"><div class="ri-head"><span class="badge lv-${esc(it.level)}">${esc(it.level)}</span><span>${esc(it.location||'')}</span></div>
          <div><b>问题：</b>${esc(it.problem||'')}</div><div><b>理由：</b>${esc(it.reason||'')}</div><div><b>建议：</b>${esc(it.suggestion||'')}</div></div>`).join('')}
        ${(lastRev.factChecks&&lastRev.factChecks.length)?`<div class="meta" style="margin:6px 0">事实核查：</div>`+lastRev.factChecks.map(fc=>`<div class="review-item"><div class="ri-head"><span class="badge v-${esc(fc.verdict)}">${esc(fc.verdict)}</span></div><div>${esc(fc.claim||'')}</div><div class="meta">依据：${esc(fc.basis||'')}</div></div>`).join(''):''}
      </div>`:'<div class="meta" style="margin-top:6px">还没有质检意见——在 WorkBuddy 里让 AI「质检这篇稿子并写进稿件库」即可</div>'}
    </div>`;}).join('');
}

// ---------- 总览 ----------
function renderOverview(){
  const active=DB.topics.filter(t=>['孵化中','采写中'].includes(t.status));
  const revs=DB.reviews.length;
  document.getElementById('statRow').innerHTML=[
    ['候选选题',DB.topics.filter(t=>t.status==='候选').length],
    ['进行中',active.length],
    ['素材',DB.materials.length],
    ['采访对象',DB.sources.length],
    ['稿件',DB.drafts.length],
    ['质检记录',revs]
  ].map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('ovActive').innerHTML=active.length?active.map(t=>topicCard(t,true)).join(''):`<div class="empty" style="grid-column:1/-1"><b>暂无进行中的选题</b>把候选选题推进到「孵化中」就会出现在这里</div>`;
  const recent=[...DB.topics].sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)).slice(0,4);
  document.getElementById('ovRecent').innerHTML=recent.length?recent.map(t=>topicCard(t,true)).join(''):`<div class="empty" style="grid-column:1/-1"><b>欢迎使用深度采写工作台</b>从「选题库」新建第一个选题开始</div>`;
}
